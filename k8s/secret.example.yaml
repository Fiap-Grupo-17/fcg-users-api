# EXEMPLO: não coloque valores reais neste arquivo (o repositório é público).
# Uso local: copie para secret.yaml (ignorado pelo Git), preencha e aplique.
# Uso no AKS: o Secret é criado fora do Git, com valores aleatórios.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcg
type: Opaque
stringData:
  Jwt__Secret: "<minimo-32-caracteres-aleatorios>"
  ConnectionStrings__Postgres: "Host=postgres-service;Port=5432;Database=fcg;Username=<usuario-postgres>;Password=<senha-postgres>"
  RabbitMQ__Password: "<senha-rabbitmq>"
  SeedAdmin__Senha: "<senha-admin-inicial>"